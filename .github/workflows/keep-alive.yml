name: Render Keep Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Acessar meu site
        run: |
          echo "Acessando o Render..."
          curl -L --max-time 180 --retry 3 --retry-delay 10 \
            -s -o /dev/null -w "HTTP Status: %{http_code}\n" \
            https://registro-produtos-anvisa.onrender.com/
