name: Render Keep Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Acessar Render
        run: |
          echo "Iniciando ping..."
          date -u

          curl \
            --location \
            --max-time 180 \
            --retry 3 \
            --retry-delay 10 \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out "HTTP: %{http_code}\nTempo: %{time_total}s\n" \
            https://registro-produtos-anvisa.onrender.com/

          echo "Ping concluído."
